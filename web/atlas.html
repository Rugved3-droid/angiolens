<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heart Atlas Scenes</title>
    <style>
      :root { --ink: #e9edf2; --muted: #9aa6b4; --panel: rgba(14, 18, 25, 0.72); --line: rgba(255, 255, 255, 0.12); --accent: #ff4a4a; }
      html, body { margin: 0; height: 100%; background: #0b0e13; color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .panel { position: fixed; background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 10px; }
      #bar { top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); box-sizing: border-box; }
      #bar button { background: transparent; color: var(--ink); border: 1px solid transparent; border-radius: 7px; padding: 6px 12px; cursor: pointer; font: inherit; }
      #bar button:hover { border-color: var(--line); }
      #bar button.on { background: rgba(255, 255, 255, 0.12); border-color: var(--line); }
      #bar .sep { width: 1px; background: var(--line); margin: 4px 2px; }
      #caption { bottom: 22px; left: 50%; transform: translateX(-50%); padding: 10px 18px; font-size: 16px; max-width: calc(100% - 32px); box-sizing: border-box; text-align: center; transition: opacity 0.5s; }
      #hover { position: fixed; pointer-events: none; padding: 5px 10px; border-radius: 6px; background: rgba(10, 12, 16, 0.85); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; display: none; z-index: 5; }
      #foot { position: fixed; bottom: 8px; right: 12px; color: var(--muted); font-size: 11px; }
      #labelPanel { top: 70px; right: 14px; width: 250px; padding: 12px; display: none; max-height: calc(100% - 140px); overflow: auto; }
      #labelPanel h3 { margin: 0 0 6px; font-size: 14px; }
      #labelPanel .hint { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
      #labelPanel .grp { margin: 8px 0 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
      #labelPanel .names { display: flex; flex-wrap: wrap; gap: 4px; }
      #labelPanel .names button, #labelPanel .row button { background: rgba(255,255,255,0.06); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; cursor: pointer; font: 12px system-ui; }
      #labelPanel .names button.cur { background: #ffd24a; color: #111; }
      #labelPanel .row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
      #sel { font-weight: 600; margin-bottom: 4px; }
      /* no backdrop blur here: the canvas draws the image underneath this frame */
      #monitor { position: fixed; right: 16px; bottom: 90px; padding: 8px; display: none; pointer-events: none;
        border: 1px solid var(--line); border-radius: 10px; background: transparent; }
      #monitor .lbl, #splitLabel .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
      #monitorImage { width: min(30vw, 300px); aspect-ratio: 1; border-radius: 4px; outline: 1px solid var(--line); }
      #splitLabel { position: fixed; left: 50%; top: 0; bottom: 0; right: 0; display: none; pointer-events: none;
        flex-direction: column; align-items: center; justify-content: center; }
      #splitLabel[style*="block"] { display: flex !important; }
      #splitImage { width: min(42vw, 72vh); aspect-ratio: 1; border-radius: 4px; outline: 1px solid var(--line); margin-bottom: 10px; }
      @media (max-width: 640px) { #labelPanel { width: auto; left: 14px; } #caption { font-size: 14px; } #monitorImage { width: 38vw; } }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="bar" class="panel">
      <button id="bHeart" class="on">Heart</button><button id="bPatient">Heart in the patient</button>
      <button id="bLab">Cath lab</button><button id="bXray">X-ray</button>
      <span class="sep"></span>
      <span id="carmViews" style="display:none">
        <button data-v="ap">AP</button><button data-v="rao30">RAO 30</button><button data-v="lao45">LAO 45</button>
        <button data-v="raocaud">RAO caudal</button><button data-v="spider">Spider</button>
      </span>
      <span id="labCams" style="display:none"><button data-v="room">Room</button><button data-v="operator">Operator</button></span>
      <span id="xrCams" style="display:none">
        <button data-v="room">Room</button><button data-v="beam">Beam</button><button data-v="split">Side by side</button>
      </span>
      <span id="inject" style="display:none"><button data-v="left">Left coronary</button><button data-v="right">Right coronary</button></span>
      <span id="heartViews" style="display:contents">
        <button data-v="front" class="on">Whole heart</button><button data-v="root">Aortic root</button>
      </span>
      <span id="views" style="display:contents">
        <button data-v="front">Front</button><button data-v="left">Left side</button><button data-v="right">Right side</button>
        <button data-v="feet">From the feet</button><button data-v="head">From the head</button>
      </span>
      <span class="sep"></span>
      <button id="bVeins" class="on">Cardiac veins</button><button id="bLabel">Label branches</button>
    </div>
    <div id="caption" class="panel"></div>
    <!-- the image (Scene 4): the canvas draws the angiogram into these rectangles; the frames are HTML only -->
    <div id="monitor"><div class="lbl">Image</div><div id="monitorImage"></div></div>
    <div id="splitLabel"><div id="splitImage"></div><div class="lbl">The image on the detector</div></div>
    <div id="hover"></div>
    <div id="labelPanel" class="panel">
      <h3>Label mode</h3>
      <div class="hint">Click a coloured branch, then pick its name. Saved in this browser; export to keep a file.</div>
      <div id="sel">No branch selected</div>
      <div id="names"></div>
      <div class="row"><button id="lExport">Export labels</button><label><input id="lImport" type="file" accept=".json" hidden /><button id="lImportBtn">Import</button></label></div>
    </div>
    <div id="foot">Z-Anatomy atlas (CC BY-SA 4.0) · vessel sizes are the atlas's own, not a patient's</div>
    <script type="module" src="/src/atlasHero.ts"></script>
  </body>
</html>
